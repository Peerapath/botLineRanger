[pytest]
# bot/tests/ and tools/tests/ are both packages literally named `tests`, so the default
# prepend import mode gives them the same module name and the second one collected fails
# with "No module named 'tests.test_ratelimit'". importlib mode derives the module name
# from the path below rootdir instead, making them bot.tests.* and tools.tests.*.
#
# This has to be repo-wide config rather than a habit at the command line, because the
# plan's own task steps run `pytest bot/tests/ tools/tests/ -q` as one command.
addopts = --import-mode=importlib
testpaths = bot/tests tools/tests
